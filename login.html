<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign In: Amitabha Foundation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal-900:#1a242f;--teal-800:#2c3e50;--teal-700:#c47a4a;
  --teal-600:#d68d5b;--teal-500:#e3a681;--teal-100:#f9e6d4;
  --teal-50:#fdf2e8;--gold:#daa520;--bg:#fdf5ee;
  --text:#1a1a1a;--muted:#666;--border:#e0d6cc;
  --radius:10px;--sans:"Plus Jakarta Sans",system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--teal-900);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.page-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.2rem;background:linear-gradient(135deg,var(--teal-700) 0%,var(--teal-800) 60%,var(--teal-900) 100%)}

/* Auth card */
.auth-card{background:#fff;border-radius:18px;padding:2.8rem 2.4rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.auth-logo{height:60px;width:auto;display:block;margin:0 auto 1.4rem;object-fit:contain}
.auth-card h1{font-size:1.45rem;font-weight:800;color:var(--teal-800);text-align:center;margin-bottom:.3rem}
.auth-card .sub{font-size:.88rem;color:var(--muted);text-align:center;margin-bottom:1.9rem}

/* Form */
.f-group{margin-bottom:1.15rem}
.f-group label{display:block;font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:.4rem}
.f-group input{width:100%;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;font-family:var(--sans);outline:none;transition:border-color .2s,box-shadow .2s;background:#fff;color:var(--text)}
.f-group input:focus{border-color:var(--teal-700);box-shadow:0 0 0 3px rgba(196,122,74,.12)}
.submit-btn{width:100%;padding:.82rem;background:var(--teal-700);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;font-family:var(--sans);cursor:pointer;transition:background .2s;margin-top:.3rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.submit-btn:hover{background:var(--teal-800)}
.submit-btn:disabled{opacity:.65;cursor:not-allowed}
.submit-btn .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.submit-btn.loading .spin{display:block}
.submit-btn.loading .btn-label{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Alerts */
.alert{border-radius:8px;padding:.75rem 1rem;font-size:.86rem;font-weight:500;margin-bottom:1rem;display:none;align-items:flex-start;gap:.55rem}
.alert.show{display:flex}
.alert-error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.alert-success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}

/* Footer links */
.auth-footer{margin-top:1.5rem;text-align:center;font-size:.86rem;color:var(--muted)}
.auth-footer a{color:var(--teal-700);font-weight:600;text-decoration:none}
.auth-footer a:hover{text-decoration:underline}

.divider{display:flex;align-items:center;gap:.8rem;margin:1.4rem 0}
.divider span{font-size:.78rem;color:var(--muted);white-space:nowrap}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Bottom bar */
.page-foot{text-align:center;padding:1.2rem;font-size:.78rem;color:rgba(255,255,255,.5)}
.page-foot a{color:rgba(255,255,255,.7);text-decoration:none}
.page-foot a:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="page-wrap">
  <div>
    <div class="auth-card">
      <img src="Photo/AF_EH%20ARGB%20LOGO%20.png" alt="Amitabha Foundation" class="auth-logo">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your account</p>

      <div class="alert alert-error" id="err-alert">
        <i class="fa fa-circle-exclamation"></i>
        <span id="err-msg">Invalid email or password.</span>
      </div>

      <form id="signin-form" autocomplete="on" onsubmit="doSignIn(); return false;" novalidate>
      <div class="f-group">
        <label for="inp-email">Email address</label>
        <input type="email" id="inp-email" name="email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="f-group">
        <label for="inp-pass">Password</label>
        <input type="password" id="inp-pass" name="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button type="submit" class="submit-btn" id="signin-btn">
        <div class="spin"></div>
        <span class="btn-label"><i class="fa fa-arrow-right-to-bracket"></i> Sign In</span>
      </button>
      </form>

      <div class="divider"><span>New here?</span></div>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
      <div class="auth-footer" style="margin-top:.6rem">
        <a href="main_page.html"><i class="fa fa-arrow-left" style="font-size:.75rem"></i> Back to website</a>
      </div>
    </div>
  </div>
</div>

<div class="page-foot">
  &copy; Amitabha Foundation Elder Home &nbsp;·&nbsp; <a href="main_page.html">Visit Website</a>
</div>

<script>
/* If already signed in, skip login */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  location.replace(profile?.role === 'admin' ? 'admin.html' : 'dashboard.html');
})();

function showErr(msg) {
  const el = document.getElementById('err-alert');
  document.getElementById('err-msg').textContent = msg;
  el.classList.add('show');
}
function hideErr() { document.getElementById('err-alert').classList.remove('show'); }
function setLoading(on) {
  const btn = document.getElementById('signin-btn');
  btn.classList.toggle('loading', on);
  btn.disabled = on;
}

async function doSignIn() {
  hideErr();
  const email = document.getElementById('inp-email').value.trim();
  const pass  = document.getElementById('inp-pass').value;
  if (!email || !pass) { showErr('Please enter your email and password.'); return; }

  setLoading(true);
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { setLoading(false); showErr(error.message || 'Invalid email or password.'); return; }

  const { data: profile } = await sb.from('profiles').select('role').eq('id', data.user.id).single();
  location.replace(profile?.role === 'admin' ? 'admin.html' : 'dashboard.html');
}

/* Enter key is handled natively by the <form> submit event */
</script>
</body>
</html>
