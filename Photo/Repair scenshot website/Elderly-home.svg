      .leaf-wiggle-1, .leaf-wiggle-2, .leaf-wiggle-3 {
        transform-origin: center bottom;
        transform-box: fill-box;
      }
      .leaf-wiggle-1 { animation: leaf-wiggle 4s ease-in-out infinite; }
      .leaf-wiggle-2 { animation: leaf-wiggle 5s ease-in-out infinite 1s; }
      .leaf-wiggle-3 { animation: leaf-wiggle 4.5s ease-in-out infinite 0.5s; }

      @keyframes head-wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(4deg); }
        75% { transform: rotate(-4deg); }
      }
      
      .head-wiggle-1, .head-wiggle-2 {
        transform-origin: center bottom;
        transform-box: fill-box;
