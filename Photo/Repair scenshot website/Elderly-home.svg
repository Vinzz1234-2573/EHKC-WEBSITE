      .head-wiggle-1 { animation: head-wiggle 3s ease-in-out infinite; }
      .head-wiggle-2 { animation: head-wiggle 4s ease-in-out infinite 0.5s; }

      @keyframes wheel-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
